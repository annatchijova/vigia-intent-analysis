name: VIGIA EBS v1 Conformance & CI

# SANS FIND EVIL Hackathon 2026
# Verifica integridad criptográfica, calibración y demo end-to-end
# en cada push/PR a main.
#
# Falla si:
#   - Algún test de integración falla (T01-T55)
#   - La calibración sintética no produce .pkl válidos
#   - Algún bundle no pasa verify_ebs_v1.py (Level 2+)
#   - El demo_case.py retorna exit != 0

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  conformance:
    name: EBS v1 Conformance Suite
    runs-on: ubuntu-latest

    steps:
    # ── Checkout ──────────────────────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ── Python ───────────────────────────────────────────────────────────
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"

    # ── Dependencias ──────────────────────────────────────────────────────
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy scikit-learn
        pip install pydantic>=2.0 matplotlib
        # Intentar instalación como paquete; tolerar fallo en flat layout
        cp pyproject__1_.toml pyproject.toml 2>/dev/null || true
        pip install -e . 2>/dev/null || echo "pip install -e omitido — flat layout"

    # ── Configurar PYTHONPATH ─────────────────────────────────────────────
    - name: Configure PYTHONPATH
      run: |
        echo "PYTHONPATH=${{ github.workspace }}/vigia_prod:${{ github.workspace }}" >> $GITHUB_ENV

    # ── Tests de integración ──────────────────────────────────────────────
    - name: Run EBS v1 Integration Tests
      run: |
        python3 test_ebs_v1_integration__4_.py
      env:
        PYTHONPATH: ${{ github.workspace }}/vigia_prod:${{ github.workspace }}

    # ── Calibración sintética ─────────────────────────────────────────────
    - name: Fit Calibration — Synthetic Bootstrap (n=180)
      run: |
        python3 vigia_prod/scripts/fit_calibration.py \
          --generate-synthetic \
          --n 180 \
          --output vigia_prod/models/
      env:
        PYTHONPATH: ${{ github.workspace }}/vigia_prod:${{ github.workspace }}

    - name: Verify calibration artifacts exist
      run: |
        test -f vigia_prod/models/calibrated_lr_models.pkl   || (echo "FAIL: KDE .pkl no generado" && exit 1)
        test -f vigia_prod/models/nlp_covariance.pkl          || (echo "FAIL: covariance .pkl no generado" && exit 1)
        test -f vigia_prod/models/calibration_metadata.json   || (echo "FAIL: metadata no generado" && exit 1)
        echo "OK: artefactos de calibración presentes"

    # ── Demo end-to-end ───────────────────────────────────────────────────
    - name: Run Demo Cases — All 5 cases
      run: |
        python3 demo_case.py --all-cases --output output/ --no-verify
      env:
        PYTHONPATH: ${{ github.workspace }}/vigia_prod:${{ github.workspace }}

    - name: Verify demo output files exist
      run: |
        count=$(ls output/bundle_*.json 2>/dev/null | wc -l)
        echo "Bundles generados: $count"
        [ "$count" -ge 5 ] || (echo "FAIL: se esperaban >= 5 bundles, se encontraron $count" && exit 1)
        echo "OK"

    # ── Verificación criptográfica ────────────────────────────────────────
    - name: Cryptographic Verification — All Bundles (stdlib only)
      run: |
        FAIL=0
        for bundle in output/bundle_*.json; do
          echo "Verificando: $bundle"
          python3 verify_ebs_v1__3_.py "$bundle" || { echo "FAIL: $bundle"; FAIL=1; }
        done
        exit $FAIL

    # ── Smoke test del pipeline con calibración KDE ───────────────────────
    - name: Smoke Test — Pipeline en modo FULL (post-calibración)
      run: |
        python3 -c "
        import sys
        sys.path.insert(0, 'vigia_prod')
        from pipeline import run_vigia
        result = run_vigia(
            signals_data=[
                {'tool_name': 'SDA', 'value': 0.85, 'z_score': 2.8, 'confidence': 0.92},
                {'tool_name': 'CLI', 'value': 0.70, 'z_score': 1.9, 'confidence': 0.88},
            ],
            calibration_path='vigia_prod/models/calibrated_lr_models.pkl',
            covariance_path='vigia_prod/models/nlp_covariance.pkl',
        )
        assert result['verify']['passed'], f'Bundle inválido: {result[\"verify\"]}'
        assert result['mode'] == 'FULL', f'Pipeline no activó modo FULL: {result[\"mode\"]}'
        print(f'OK: mode={result[\"mode\"]} decision={result[\"decision\"]} posterior={result[\"posterior\"]:.4f}')
        "
      env:
        PYTHONPATH: ${{ github.workspace }}/vigia_prod:${{ github.workspace }}

    # ── Resumen de bundles ────────────────────────────────────────────────
    - name: Upload bundles as artifact (para inspección post-run)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: vigia-bundles-${{ github.run_id }}
        path: output/
        retention-days: 14
