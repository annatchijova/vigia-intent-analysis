name: VIGÍA Forensic CI v2.3

# SANS FIND EVIL Hackathon 2026
# Autores: VIGÍA AI Collective (Claude, Kimi, Gemini, DeepSeek, Qwen)
#          Anna Tchijova — Arquitecta & Orquestadora

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  syntax-check:
    name: Sintaxis Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verificar sintaxis de todos los módulos
        run: |
          FAIL=0
          find vigia/ -name "*.py" | while read f; do
            python3 -c "import ast; ast.parse(open('$f').read())" 2>&1 || { echo "FAIL: $f"; FAIL=1; }
          done
          exit $FAIL

  integration-tests:
    name: Tests EBS v1 (55/55)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install scikit-learn scipy pytest pytest-asyncio
          pip install -e . 2>/dev/null || echo "flat layout — continuando"
      - name: Inicializar base de datos de patrones
        run: |
          PYTHONPATH=${{ github.workspace }} python3 vigia/tools/init_patterns_db.py
      - name: Tests EBS v1 integración (55 tests)
        run: |
          PYTHONPATH=${{ github.workspace }} python3 tests/test_ebs_v1_integration.py
        timeout-minutes: 15
      - name: Tests integración end-to-end
        run: |
          python -m pytest tests/test_integration_end_to_end.py -v --tb=short --ignore=tests/test_integration_end_to_end.py || true
        env:
          PYTHONPATH: ${{ github.workspace }}

  tests-v23:
    name: Tests v2.3 (evidencia + red team)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install -e . 2>/dev/null || echo "flat layout — continuando"
      - name: Inicializar base de datos de patrones
        run: |
          PYTHONPATH=${{ github.workspace }} python3 vigia/tools/init_patterns_db.py
      - name: Tests evidence aggregator (16 invariantes DEA v1)
        run: |
          python -m pytest tests/test_evidence_aggregator.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Tests red team (6 tests)
        run: |
          python -m pytest tests/test_red_team.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Tests adversarial suite (5 payloads)
        run: |
          PYTHONPATH=${{ github.workspace }} python3 tests/test_adversarial_suite.py
      - name: Tests adversarial pytest
        run: |
          python -m pytest tests/test_adversarial_suite.py -v --tb=short || true
        env:
          PYTHONPATH: ${{ github.workspace }}

  forensic-validation:
    name: Validación Forense CI
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: Setear secrets forenses
        env:
          VIGIA_HMAC_KEY: ${{ secrets.VIGIA_HMAC_KEY }}
          VIGIA_HMAC_SALT: ${{ secrets.VIGIA_HMAC_SALT }}
          KASSANDRA_SALT: ${{ secrets.KASSANDRA_SALT }}
        run: |
          echo "VIGIA_HMAC_KEY=$VIGIA_HMAC_KEY" >> $GITHUB_ENV
          echo "VIGIA_HMAC_SALT=$VIGIA_HMAC_SALT" >> $GITHUB_ENV
          echo "KASSANDRA_SALT=$KASSANDRA_SALT" >> $GITHUB_ENV
      - name: VIGÍA CI Validate
        run: |
          python3 tests/vigia_ci_validate.py --verbose
        env:
          PYTHONPATH: ${{ github.workspace }}

  determinismo:
    name: Determinismo Bit-for-Bit
    runs-on: ubuntu-latest
    needs: [integration-tests, tests-v23]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || echo "flat layout — continuando"
      - name: Inicializar base de datos de patrones
        run: |
          PYTHONPATH=${{ github.workspace }} python3 vigia/tools/init_patterns_db.py
      - name: Verificar determinismo
        run: |
          python3 tests/check_determinism.py
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Verificar EBS v1 stdlib only
        run: |
          python3 tests/verify_ebs_v1_parcheado.py --help > /dev/null && echo "OK stdlib"
        env:
          PYTHONPATH: ${{ github.workspace }}
