name: VIGÍA Forensic CI v2.3

# SANS FIND EVIL Hackathon 2026
# Autores: VIGÍA AI Collective (Claude, Kimi, Gemini, DeepSeek, Qwen)
#          Anna Tchijova — Arquitecta & Orquestadora
#
# Garantías validadas en cada push:
#   - Sintaxis Python válida en todos los módulos
#   - Tests de integración EBS v1
#   - Tests de evidencia y red team v2.3
#   - Determinismo: mismo input → mismo hash
#   - Validación CI forense (vigia_ci_validate)

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # JOB 1: Validación de sintaxis — rápido, bloquea todo si falla
  # ============================================================
  syntax-check:
    name: Sintaxis Python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verificar sintaxis de todos los módulos
        run: |
          echo "Verificando sintaxis..."
          FAIL=0
          find vigia/ -name "*.py" | while read f; do
            python3 -c "import ast; ast.parse(open('$f').read())" 2>&1 && echo "OK: $f" || { echo "FAIL: $f"; FAIL=1; }
          done
          exit $FAIL

  # ============================================================
  # JOB 2: Tests de integración EBS v1 (55 tests)
  # ============================================================
  integration-tests:
    name: Tests EBS v1 + Integración
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          pip install -e . 2>/dev/null || echo "flat layout — continuando"

      - name: Tests EBS v1 integración
        run: |
          python -m pytest tests/test_ebs_v1_integration.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Tests integración end-to-end
        run: |
          python -m pytest tests/test_integration_end_to_end.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ============================================================
  # JOB 3: Tests v2.3 — evidencia, red team, adversarial
  # ============================================================
  tests-v23:
    name: Tests v2.3 (evidencia + red team)
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install -e . 2>/dev/null || echo "flat layout — continuando"

      - name: Tests evidence aggregator (invariantes DEA v1)
        run: |
          python -m pytest tests/test_evidence_aggregator.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Tests red team (20 payloads adversariales)
        run: |
          python -m pytest tests/test_red_team.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Tests adversarial suite
        run: |
          python -m pytest tests/test_adversarial_suite.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ============================================================
  # JOB 4: Validación CI forense (determinismo + seguridad)
  # ============================================================
  forensic-validation:
    name: Validación Forense
    runs-on: ubuntu-latest
    needs: syntax-check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Setear secrets forenses
        env:
          VIGIA_HMAC_KEY: ${{ secrets.VIGIA_HMAC_KEY }}
          VIGIA_HMAC_SALT: ${{ secrets.VIGIA_HMAC_SALT }}
          KASSANDRA_SALT: ${{ secrets.KASSANDRA_SALT }}
        run: |
          echo "VIGIA_HMAC_KEY=$VIGIA_HMAC_KEY" >> $GITHUB_ENV
          echo "VIGIA_HMAC_SALT=$VIGIA_HMAC_SALT" >> $GITHUB_ENV
          echo "KASSANDRA_SALT=$KASSANDRA_SALT" >> $GITHUB_ENV

      - name: VIGÍA CI Validate — checks forenses
        run: |
          python tests/vigia_ci_validate.py --verbose
        env:
          PYTHONPATH: ${{ github.workspace }}

  # ============================================================
  # JOB 5: Determinismo bit-for-bit
  # ============================================================
  determinismo:
    name: Determinismo Bit-for-Bit
    runs-on: ubuntu-latest
    needs: [integration-tests, tests-v23]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install -e . 2>/dev/null || echo "flat layout — continuando"

      - name: Verificar determinismo (mismo input → mismo SHA-256)
        run: |
          python tests/check_determinism.py
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Verificar EBS v1 (stdlib only)
        run: |
          python tests/verify_ebs_v1_parcheado.py
        env:
          PYTHONPATH: ${{ github.workspace }}
