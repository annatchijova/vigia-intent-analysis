name: VIGÍA Test Suite
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # B-212: instalar TAMBIÉN requirements-ci.txt — es el archivo que el
      # contrato S-1 (tests/test_requirements_ci_contract.py) garantiza
      # completo para la suite. Instalar solo requirements.txt dejó este job
      # sin fastapi (4 módulos de tests de API sin colectar, exit 2).
      - run: pip install -r requirements.txt -r requirements-ci.txt && pip install scipy
      - run: python -m pytest tests/ vigia/tests/ -q --tb=short --no-cov
        env:
          PYTHONPATH: ${{ github.workspace }}
