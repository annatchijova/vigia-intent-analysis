# ─────────────────────────────────────────────────────────────────────────────
# VIGÍA — Docker Build & Publish to GitHub Container Registry (ghcr.io)
#
# Genera el package digest sha256 visible en GitHub → igual que calebevans/mulder.
#
# Permisos requeridos: Settings → Actions → General → Workflow permissions
#   → "Read and write permissions" (para publicar en ghcr.io)
#
# Sin secrets adicionales: usa GITHUB_TOKEN nativo de Actions.
#
# Triggers:
#   * Push a main → publica tag :latest + :sha-XXXXXXX
#   * Push de tag v* → publica :v1.2.3 + :latest
#   * workflow_dispatch → build manual desde GitHub UI
# ─────────────────────────────────────────────────────────────────────────────
name: VIGÍA Docker Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push to ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # :latest en push a main
            type=raw,value=latest,enable={{is_default_branch}}
            # :sha-XXXXXXX en cada push
            type=sha,prefix=sha-,format=short
            # :v1.2.3 en tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=VIGÍA Forensic Analysis
            org.opencontainers.image.description=Deterministic forensic intentionality analysis — SANS FIND EVIL 2026
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Anna Tchijova

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build cache — acelera rebuilds en CI
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + provenance → supply chain attestation (Daubert-compatible)
          provenance: true
          sbom: true

      # Atestación criptográfica del build — vincula digest a commit SHA
      # Esto es lo que genera el "sha256-XXXX" visible en GitHub Packages
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Print image digest
        run: |
          echo "Image published:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"
          echo ""
          echo "Pull command:"
          echo "  docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}"

  # ── Job de verificación post-publicación ────────────────────────────────────
  verify-image:
    name: Verify published image
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify image integrity
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image-ref }}"
          echo "Pulling: $IMAGE"
          docker pull "$IMAGE"

      - name: Run determinism smoke test
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image-ref }}"
          # Verificación básica: Python importa correctamente
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:size=50M,noexec,nosuid \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint python3 \
            "$IMAGE" \
            -c "
          from fractions import Fraction
          assert type(Fraction(1,2) + Fraction(1,3)) is Fraction
          print('VIGIA_INTEGRITY_OK: Fraction invariant confirmed')
          "
