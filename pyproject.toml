[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigia-forensic"
version = "2.0.0"
description = "VIGÍA Forensic Suite — Intentionality Analysis for DFIR (SANS FIND EVIL 2026)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Anna Tchijova", email = "anna.tchijova@gmail.com" },
]
keywords = ["forensics", "dfir", "sift", "mcp", "llm-detection", "evidence-bundle", "bayesian", "peirce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ---------------------------------------------------------------------------
# Dependencias
# Core (sin sklearn): stdlib + pydantic opcional — el sistema corre en FALLBACK.
# Full (con sklearn): activa KDE calibrado + Ledoit-Wolf (modo FULL).
# ---------------------------------------------------------------------------
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.18.0",
    "mcp>=0.1.0",
    "fastmcp>=0.4.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8.0",
    "defusedxml>=0.7.1",
    "python-magic>=0.4.27",
    "iso8601>=2.0.0",
    "aiofiles>=23.0.0",
    "Pillow>=10.0.0",
    "httpx>=0.25.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
# Motor de inferencia completo
full = [
    "scipy>=1.11",
    "scikit-learn>=1.3",
]
# B-208: recuperación real de last_execution_time/run_count en prefetch
# Win10+ (MAM-comprimido) vía pyscca (libscca-python). Extensión compilada
# — requiere la librería C libscca del sistema, no es pip-puro. OPCIONAL:
# vigia/sift/prefetch_analyzer.py degrada honestamente sin ella (placeholders
# "unknown"/1), Mode 1 sigue offline/cero-dependencias sin este extra.
prefetch = [
    "libscca-python>=20221027",
]
# Entorno de desarrollo y tests
dev = [
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
vigia = "vigia.cli:main"

[project.urls]
Repository = "https://github.com/annatchijova/vigia-intent-analysis"
"Bug Tracker" = "https://github.com/annatchijova/vigia-intent-analysis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vigia*"]
exclude = ["*__pycache__*", "*.pyc", "tests*", "data*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md"]

# ---------------------------------------------------------------------------
# Herramientas de desarrollo
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
# V-2 (docs/PATTERN_HUNT_20260718.md, 2026-07-18): testpaths was ["tests"],
# so a bare `pytest` and the coverage config silently dropped vigia/tests/
# (test_b047_correlation_groups.py, test_lr_calibrator_serialization.py) —
# only the full CLAUDE.md command line reached them. Both suites are now in
# testpaths so the default invocation matches the documented "full suite"
# (CLAUDE.md §"Running Tests"). tests/integration is ignored here for the
# same reason the documented command --ignore's it: it holds the standalone
# @test-decorator runner (run as `python3 tests/integration/...`, not a
# pytest module — see tests/integration/conftest.py). tests/e2e is NOT
# ignored: it is part of the suite where `mcp` is installable; its
# collection depends on mcp availability (KNOWN_LIMITATIONS L-045), not on
# this config — silencing it here would be the very scope-drop V-2 is about.
testpaths = ["tests", "vigia/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
# Coverage scope includes the root decision-path modules (vigia_scorer,
# vigia_agent, sift_orchestrator) that live outside the vigia/ package. They
# ARE the sealed verdict pipeline — measuring only vigia/ hid the primary core.
addopts = "-v --tb=short --ignore=tests/integration --cov=vigia --cov=vigia_scorer --cov=vigia_agent --cov=sift_orchestrator --cov-report=term-missing --cov-report=html:htmlcov"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
]

[tool.coverage.run]
# Root decision-path modules are measured alongside the vigia/ package so the
# reported number reflects the code that produces the sealed verdict.
source = ["vigia", "vigia_scorer", "vigia_agent", "sift_orchestrator"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# Mutation testing (mutmut) — mide si la suite DETECTA cambios de lógica,
# no si los ejecuta. Cobertura de línea responde "¿se ejecutó?"; el mutation
# score responde "¿se verificó?". Ver docs/MUTATION_TESTING.md.
#
# ALCANCE DELIBERADO: solo la ruta de veredicto sellado. Mutar módulos con
# ~0% de cobertura no enseña nada que la cobertura no diga ya más barato —
# el mutante sobrevive trivialmente. only_mutate lista exactamente los
# módulos donde ya hay tests que puedan morder.
# ---------------------------------------------------------------------------
[tool.mutmut]
# Copiados al sandbox mutants/. Incluye los módulos raíz de la ruta de
# decisión: son los que producen el veredicto sellado (mismo criterio que
# [tool.coverage.run].source).
source_paths = [
    "vigia",
    "vigia_scorer.py",
    "vigia_agent.py",
    "sift_orchestrator.py",
]

# Módulos efectivamente mutados. Criterio de admisión: cobertura de línea
# suficiente para que un mutante superviviente signifique algo (>= ~45% en
# coverage_baseline). Ampliar esta lista es la vía para subir el alcance.
only_mutate = [
    "vigia_scorer.py",
    "vigia/tools/caie.py",
    "vigia/core/semiotic_detector_v2.py",
    "vigia/core/evidence_aggregator.py",
    "vigia/core/likelihood_engine.py",
    "vigia/core/decision_layer.py",
    "vigia/core/causal_closure.py",
    "vigia/collapse_decision.py",
]

# Los tests nunca se mutan (mutar un test no significa nada).
do_not_mutate = [
    "vigia/tests/*",
    "*/tests/*",
    "*_test.py",
    "test_*.py",
]

# Ficheros de datos que la suite lee en runtime y que no viven bajo
# source_paths. Sin esto los tests fallan dentro de mutants/ por FileNotFound
# y TODOS los mutantes se declararían muertos por la razón equivocada.
also_copy = [
    # Datos y corpus leídos por la suite.
    "data",
    "cases",
    "evidence",
    "results",
    "models",
    "baselines_institucionales.yaml",
    "phonetic_dict.json",
    "requirements.txt",
    "requirements-ci.txt",
    # Lo lee tests/test_mutation_config_contract.py, que debe poder correr
    # tanto en el árbol real como dentro de mutants/.
    ".gitignore",
    # Paquetes/directorios raíz importados o invocados por los tests.
    "forensics",
    "scripts",
    "tools",
    # Módulos raíz que los tests importan pero que NO se mutan (no son ruta
    # de veredicto). Sin ellos, ModuleNotFoundError dentro de mutants/ y el
    # runner de stats aborta antes de medir nada.
    "run_all_agent.py",
    "run_llm_cases.py",
    "validate_case.py",
    "verify_tool_log.py",
    "vigia_api.py",
    "caie_legacy_root.py",
]

# --no-cov: pyproject fuerza --cov vía addopts; medir cobertura por mutante
# multiplica el coste sin aportar nada. -p no:randomly/no:cacheprovider
# mantiene el runner determinista entre mutantes.
pytest_add_cli_args = [
    "--no-cov",
    "-p", "no:cacheprovider",
    "--tb=no",
    "-q",
]

# Selección de tests. tests/integration se ignora por la misma razón que en
# addopts (runner standalone, no módulo pytest). Los módulos que importan
# el bridge MCP quedan fuera: no colectan sin `mcp` instalable
# (KNOWN_LIMITATIONS L-045) y no cubren la ruta de veredicto.
pytest_add_cli_args_test_selection = [
    "tests",
    "vigia/tests",
    "--ignore=tests/integration",
    # Módulos que importan vigia/vigia_sift_bridge.py. No colectan sin `mcp`
    # (KNOWN_LIMITATIONS L-045) y cubren la superficie MCP, no la ruta de
    # veredicto: ningún mutante de only_mutate depende de ellos. Su exclusión
    # es un CAVEAT declarado del score, no una omisión silenciosa —
    # docs/MUTATION_TESTING.md §Limitaciones.
    "--ignore=tests/e2e",
    "--ignore=tests/test_b122_universal_tool_invoked_audit.py",
    "--ignore=tests/test_b164_mcp_mount_root.py",
    "--ignore=tests/test_b169_mcp_invocation_audit.py",
    "--ignore=tests/test_b173_bridge_work_root.py",
    # Tests META-REPO: no ejecutan la ruta de veredicto, INSPECCIONAN texto
    # fuente / ficheros del repo (regex sobre caie.py, inspect.getsource,
    # rglob de *.md). Dentro de mutants/ el fuente contiene TODAS las
    # variantes mutantes en línea (`x_f__mutmut_N`, literales "XX..XX"), así
    # que estos tests leen artefactos del harness y fallan por una razón que
    # no es la lógica bajo prueba. No pueden matar un mutante de
    # only_mutate — no invocan ese código — luego excluirlos no altera el
    # score. Ver docs/MUTATION_TESTING.md §"Tests invisibles a la mutación".
    "--ignore=tests/test_m3_scorer_caie_parity.py",
    "--ignore=tests/test_registry_integrity.py",
    "--ignore=tests/test_requirements_ci_contract.py",
    "--ignore=tests/test_security_md_rate_limit_contract.py",
]

# Solo muta líneas que algún test ejecuta. Un mutante en línea no cubierta
# sobrevive trivialmente y sólo añade ruido al triaje.
mutate_only_covered_lines = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
