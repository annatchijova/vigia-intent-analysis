[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vigia-forensic"
version = "2.0.0"
description = "VIGÍA Forensic Suite — Intentionality Analysis for DFIR (SANS FIND EVIL 2026)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Anna Tchijova", email = "anna.tchijova@gmail.com" },
]
keywords = ["forensics", "dfir", "sift", "mcp", "llm-detection", "evidence-bundle", "bayesian", "peirce"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ---------------------------------------------------------------------------
# Dependencias
# Core (sin sklearn): stdlib + pydantic opcional — el sistema corre en FALLBACK.
# Full (con sklearn): activa KDE calibrado + Ledoit-Wolf (modo FULL).
# ---------------------------------------------------------------------------
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.18.0",
    "mcp>=0.1.0",
    "fastmcp>=0.4.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
# Motor de inferencia completo
full = [
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "Pillow>=10.0.0",
]
# Entorno de desarrollo y tests
dev = [
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "Pillow>=10.0.0",
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
vigia = "cli:main"

[project.urls]
Repository = "https://github.com/annatchijova/vigia-intent-analysis"
"Bug Tracker" = "https://github.com/annatchijova/vigia-intent-analysis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["vigia*", "pipeline*", "scripts*"]
exclude = ["*__pycache__*", "*.pyc", "tests*", "data*", "docs*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md"]

# ---------------------------------------------------------------------------
# Herramientas de desarrollo
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
