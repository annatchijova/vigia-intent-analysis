[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vigia-forensic"
version = "1.0.0"
description = "VIGÍA Forensic Suite — Intentionality Analysis for DFIR (SANS FIND EVIL 2026)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Annia Tchijova", email = "anna.tchijova@gmail.com" },
]
keywords = ["forensics", "dfir", "sift", "llm-detection", "evidence-bundle", "bayesian"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ---------------------------------------------------------------------------
# Dependencias
#
# Core (sin sklearn):  stdlib + pydantic opcional — el sistema corre en FALLBACK.
# Full (con sklearn):  activa KDE calibrado + Ledoit-Wolf (modo FULL).
# ---------------------------------------------------------------------------
dependencies = [
    # Pydantic v2 preferido — fallback a dataclasses si no está disponible
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Motor de inferencia completo
full = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]
# Entorno de desarrollo y tests
dev = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
# Punto de entrada del verificador independiente (sin dependencias de producción)
vigia-verify = "forensics.verify_ebs_v1:main"
# Punto de entrada del pipeline principal
vigia = "pipeline:main"

[project.urls]
Repository = "https://github.com/annatchijova/vigia"
"Bug Tracker" = "https://github.com/annatchijova/vigia/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["models*", "engine*", "governance*", "audit*", "forensics*"]
exclude = ["*__pycache__*", "*.pyc"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md"]

# ---------------------------------------------------------------------------
# Herramientas de desarrollo
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
python_functions = ["t0*", "t1*", "t2*", "t3*", "t4*", "t5*", "t6*"]
# El test runner personalizado maneja la ejecución; pytest como runner alternativo
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # líneas largas — código forense tiene comentarios descriptivos

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true  # dependencias opcionales (numpy, sklearn)
