  Los perfiles adversariales fueron calibrados sobre corpus de:
  - Phishing emails (APWG, 2023-2024)
  - Scam transcripts (FTC Consumer Sentinel)
  - Social engineering playbooks (contenido OSINT)
  - Deepfake audio transcripts (synthetic voice scams)
  
  Los perfiles institucionales fueron calibrados sobre:
  - Resoluciones judiciales argentinas (CSJN, 2019-2024)
  - Sentencias federales US (PACER, 2020-2024)
  - Reportes policiales operativos (FOIA releases, 2018-2024)
  - Peritajes forenses oficiales (casos públicos)
  
  Todos los valores σ representan desviación estándar muestral
  con n>1000 documentos por categoría.
