  # -------------------------------------------------------------------------
  # REGISTRO ADVERSARIO - SOCIAL ENGINEERING (Phishing/Scam)
  # -------------------------------------------------------------------------
  ADVERSARY_SOCIAL_ENGINEERING:
    jurisdiction: "Threat Actor - Social Engineering Campaigns"
    language: "es/en/bilingual"
    register_type: "adversarial_deception"
    
    # SDA-NR: Caos sintáctico, baja nominalización (urgencia verbal)
    nv_ratio: { mean: 1.2, std: 0.3, alert_threshold: 1.8 }  # Inversión: alerta si es ALTO
    nominalization: { mean: 0.28, std: 0.06, alert_threshold: 0.40 }
    prepositional_density: { mean: 0.10, std: 0.03 }
    
    # CLI: ALTA carga cognitiva (marcadores de engaño)
    exclusion_density: { mean: 0.12, std: 0.04, alert_threshold: 0.08 }
    certainty_quant: { mean: 0.35, std: 0.08, alert_threshold: 0.20 }
    distancing_markers: { mean: 0.15, std: 0.05, alert_threshold: 0.08 }
    
    # ACP: TTR errático (inconsistencia autorial)
    ttr: { mean: 0.65, std: 0.12, alert_threshold: 0.50 }  # Alta variabilidad
    lexical_entropy: { mean: 10.5, std: 1.2, alert_threshold: 9.0 }
    syntactic_complexity: { mean: 0.15, std: 0.08, alert_threshold: 0.25 }
    
    # ROI: Ofuscación por simplificación excesiva o complejidad caótica
    fog_index: { mean: 6.5, std: 2.0, alert_min: 4.0, alert_max: 12.0 }
    info_density: { mean: 0.18, std: 0.05, alert_threshold: 0.25 }
    redundancy: { mean: 0.45, std: 0.10, alert_threshold: 0.30 }
    
