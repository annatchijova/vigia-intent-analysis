      Firstness: Signo con entropía extremadamente baja (H≈6.5 bits),
      nominalización agresiva (N/V≈5.8), preposicionalidad densa.
      Secondness: Colisión ritualizada con objeto legal (order/judgment).
      Thirdness: Hábito institucional de formalismo performativo, 
      latinismos, estructuras arcaicas preservadas intencionalmente.

