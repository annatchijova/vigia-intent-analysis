institutional_baselines:
  
  # -------------------------------------------------------------------------
  # REGISTRO JUDICIAL ESPAÑOL - Corte Suprema / Tribunales Superiores
  # -------------------------------------------------------------------------
  COURT_ES_SUPERIOR:
    jurisdiction: "Corte Suprema de Justicia Argentina / Tribunales Federales"
    language: "es"
    register_type: "legal_judicial_high"
    
    # SDA-NR: Alta nominalización, sintaxis conservadora
    nv_ratio: { mean: 4.2, std: 0.35, min_acceptable: 3.5 }
    nominalization: { mean: 0.68, std: 0.04, min_acceptable: 0.60 }
    prepositional_density: { mean: 0.22, std: 0.03 }
    
    # CLI: Baja carga cognitiva (certeza institucional)
    exclusion_density: { mean: 0.015, std: 0.005, max_acceptable: 0.025 }
    certainty_quant: { mean: 0.04, std: 0.015, max_acceptable: 0.08 }
    distancing_markers: { mean: 0.001, std: 0.001 }  # Casi inexistente
    
    # ACP: TTR conservador, vocabulario técnico cerrado
    ttr: { mean: 0.38, std: 0.03 }
    lexical_entropy: { mean: 7.8, std: 0.4 }
    syntactic_complexity: { mean: 0.35, std: 0.05 }
    
    # ROI: Complejidad legítima, densidad informativa alta
    fog_index: { mean: 17.5, std: 1.2, max_acceptable: 20.0 }
    info_density: { mean: 0.42, std: 0.03, min_acceptable: 0.35 }
    redundancy: { mean: 0.12, std: 0.04, max_acceptable: 0.20 }
    
    # Marcadores específicos de registro
    positive_markers:
      - "visto"
      - "considerando"
      - "por tanto"
      - "resuelve"
      - "falla"
      - "autos"
      - "expediente"
      - "alega"
      - "prueba"
      - "en consecuencia"
      - "en mérito de"
      - "no obstante"  # Aunque sea exclusión, es marca judicial válida
    
    negative_markers:  # Si aparecen, alerta inmediata
      - "increíble"
      - "oportunidad única"
      - "no espere"
      - "garantizado"
      - "revolucionario"
      - "ahora"
      - "gratis"
    
    peirce_interpretation: >
      Firstness: Signo documental con entropía controlada (H≈7.8 bits),
      estructura sintáctica conservadora, marcadores de ritualidad procesal.
      Secondness: Colisión esperada con objeto judicial (resolución/dictamen).
      Thirdness: Hábito institucional de precisión normativa, ausencia de 
      ambigüedad deliberada.

  # -------------------------------------------------------------------------
  # REGISTRO JUDICIAL ANGLOSAJÓN - Common Law
  # -------------------------------------------------------------------------
  COURT_EN_COMMON:
    jurisdiction: "Federal District Courts / State Supreme Courts (US/UK)"
    language: "en"
    register_type: "legal_judicial_common_law"
    
    # SDA-NR: Nominalización extrema típica del common law
    nv_ratio: { mean: 5.8, std: 0.6, min_acceptable: 4.5 }
    nominalization: { mean: 0.72, std: 0.05, min_acceptable: 0.62 }
    prepositional_density: { mean: 0.28, std: 0.04 }
    
    # CLI: Mínima carga cognitiva, máxima certeza performativa
    exclusion_density: { mean: 0.025, std: 0.008, max_acceptable: 0.04 }
    certainty_quant: { mean: 0.06, std: 0.02, max_acceptable: 0.10 }
    distancing_markers: { mean: 0.002, std: 0.002 }
    
    # ACP: TTR muy conservador (vocabulario técnico repetitivo)
    ttr: { mean: 0.32, std: 0.04 }
    lexical_entropy: { mean: 6.5, std: 0.5 }
    syntactic_complexity: { mean: 0.40, std: 0.06 }
    
    # ROI: Fog históricamente alto por tradición legal anglosajona
    fog_index: { mean: 19.0, std: 1.5, max_acceptable: 22.0 }
    info_density: { mean: 0.45, std: 0.04, min_acceptable: 0.38 }
    redundancy: { mean: 0.15, std: 0.05, max_acceptable: 0.25 }
    
    positive_markers:
